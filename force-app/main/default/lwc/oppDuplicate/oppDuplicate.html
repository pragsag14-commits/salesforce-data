<template>
    <!-- Screen 1: The Full Comprehensive Opportunity Form -->
    <div class={formVisibilityClass}>
        <!-- Form Header -->
        <div class="slds-modal__header slds-p-around_small slds-m-bottom_medium">
            <h2 class="slds-text-heading_medium font-weight-bold">New Opportunity</h2>
        </div>

        <lightning-record-edit-form 
            object-api-name="Opportunity"
            onsubmit={handleFormSubmit}
            onsuccess={handleSuccess}>
            
            <lightning-messages></lightning-messages>
            
            <!-- Grid Layout for Full Form Formats -->
            <div class="slds-grid slds-wrap slds-gutters_small">
                
                <!-- Column 1 -->
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input-field field-name="Name" required></lightning-input-field>
                    <lightning-input-field field-name="AccountId" value={recordId} disabled></lightning-input-field>
                    <lightning-input-field field-name="Amount"></lightning-input-field>
                    <lightning-input-field field-name="Type"></lightning-input-field>
                </div>
                
                <!-- Column 2 -->
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input-field field-name="CloseDate" required></lightning-input-field>
                    <lightning-input-field field-name="StageName" required></lightning-input-field>
                    <lightning-input-field field-name="Probability"></lightning-input-field>
                    <lightning-input-field field-name="LeadSource"></lightning-input-field>
                </div>

                <!-- Full Width Row -->
                <div class="slds-col slds-size_1-of-1 slds-m-top_x-small">
                    <lightning-input-field field-name="NextStep"></lightning-input-field>
                    <lightning-input-field field-name="Description"></lightning-input-field>
                </div>
            </div>

            <!-- Footer Action Buttons -->
            <div class="slds-modal__footer slds-m-top_large slds-p-horizontal_none">
                <lightning-button label="Cancel" onclick={handleCancel} class="slds-m-right_small"></lightning-button>
                <lightning-button type="submit" variant="brand" label="Save"></lightning-button>
            </div>
        </lightning-record-edit-form>
    </div>

    <!-- Screen 2: Duplicate Alert Warning Panel -->
    <div class={warningVisibilityClass}>
        <!-- Warning Header -->
        <div class="slds-modal__header slds-p-around_small slds-m-bottom_medium">
            <h2 class="slds-text-heading_medium slds-text-color_error font-weight-bold">Duplicate Warning</h2>
        </div>

        <div class="slds-notify slds-notify_alert slds-alert_warning slds-m-bottom_medium" role="alert">
            <lightning-icon icon-name="utility:warning" size="small" alternative-text="Warning" class="slds-m-right_x-small"></lightning-icon>
            <h2>An active Opportunity already exists.</h2>
        </div>

        <!-- Matching Duplicates Output Table -->
        <div class="slds-m-bottom_large slds-border_top slds-border_bottom">
            <lightning-datatable
                key-field="id"
                data={duplicateOpps}
                columns={columns}
                hide-checkbox-column>
            </lightning-datatable>
        </div>

        <!-- Resolution Buttons -->
        <div class="slds-modal__footer slds-p-horizontal_none">
            <lightning-button label="Cancel Creation" onclick={handleCancelModal} class="slds-m-right_small"></lightning-button>
            <lightning-button label="Continue Anyway" variant="brand" onclick={executeSubmit}></lightning-button>
        </div>
    </div>
</template>

<template>
    <lightning-record-edit-form 
        object-api-name="Contact" 
        record-id={contactId} 
        onsuccess={handleSuccess}>
        
        <lightning-messages></lightning-messages>
        
        <!-- Pre-populate AccountId (Only works during creation, ignored during edit) -->
        <lightning-input-field field-name="AccountId" value={accountId} class="slds-hide"></lightning-input-field>
        
        <lightning-input-field field-name="Name"></lightning-input-field>
        <lightning-input-field field-name="Title"></lightning-input-field>
        <lightning-input-field field-name="Phone"></lightning-input-field>
        <lightning-input-field field-name="Email"></lightning-input-field>
        
        <div class="slds-m-top_medium slds-text-align_center">
            <lightning-button class="slds-m-right_small" label="Cancel" onclick={handleCancel}></lightning-button>
            <lightning-button type="submit" label="Save Contact" variant="brand"></lightning-button>
        </div>
    </lightning-record-edit-form>
</template>

<template>
    <lightning-card title="Account Search & Management (Parent)" icon-name="standard:account">
        <div class="slds-p-around_medium">
            <!-- Search Bar -->
            <lightning-input 
                type="search" label="Search Accounts" value={searchTerm} 
                onchange={handleSearchChange} placeholder="Enter account name...">
            </lightning-input>

            <!-- Accounts Table -->
            <template if:true={accounts.length}>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-m-top_medium">
                    <thead>
                        <tr>
                            <th>Account Name</th>
                            <th>Industry</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={accounts} for:item="acc">
                            <tr key={acc.Id}>
                                <td>{acc.Name}</td>
                                <td>{acc.Industry}</td>
                                <td>
                                    <lightning-button 
                                        label={acc.buttonLabel} 
                                        variant={acc.buttonVariant}
                                        data-id={acc.Id}
                                        data-hascontacts={acc.hasContacts}
                                        onclick={handleMainAction}>
                                    </lightning-button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </template>
        </div>
    </lightning-card>

    <!-- MODAL 1: CALLING CHILD 1 (Contact List) -->
    <template if:true={isListModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" variant="inverse" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">Related Contacts</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <!-- Child 1 Component Tag -->
                    <c-contact-list-child 
                        contacts={selectedContacts}
                        oneditcontact={handleEditContactEvent}
                        ondeletecontact={handleDeleteContactEvent}>
                    </c-contact-list-child>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- MODAL 2: CALLING CHILD 2 (Contact Form - Add/Edit) -->
    <template if:true={isFormModalOpen}>
        <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" variant="inverse" size="small"></lightning-icon>
                    </button>
                    <h2 class="slds-text-heading_medium">{formModalHeader}</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <!-- Child 2 Component Tag -->
                    <c-contact-form-child 
                        account-id={selectedAccountId}
                        contact-id={editContactId}
                        onformsuccess={handleFormSuccessEvent}
                        oncancel={closeModal}>
                    </c-contact-form-child>
                </div>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
